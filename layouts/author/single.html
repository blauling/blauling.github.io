{{ define "main" }}
<link rel="stylesheet" href="{{ "css/author.css" | relURL }}">

<main class="profile-page">
  <div class="profile-glow" aria-hidden="true"></div>
  <section class="profile-content" aria-labelledby="author-title">
    <header class="profile-header">
      <h1 id="author-title">{{ .Params.handle | default .Title }}</h1>
      <p>{{ .Params.hero }}</p>
    </header>

    <nav class="profile-links" aria-label="Author links">
      {{ $index := 1 }}
      {{ range .Params.projects }}
        <a class="profile-row" href="{{ .url | relURL }}" style="--i: {{ $index }}">
          <span>{{ .name }}</span>
          <span class="profile-meta">{{ .description }}</span>
          <span class="profile-arrow" aria-hidden="true">&rarr;</span>
        </a>
        {{ $index = add $index 1 }}
      {{ end }}
      {{ range .Params.links }}
        <a class="profile-row" href="{{ .url | relURL }}" style="--i: {{ $index }}"
          {{ if hasPrefix .url "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
          <span>{{ .name }}</span>
          <span class="profile-arrow" aria-hidden="true">&rarr;</span>
        </a>
        {{ $index = add $index 1 }}
      {{ end }}
    </nav>

    <footer class="profile-footer">
      <a href="{{ "/" | relURL }}">back home</a>
    </footer>
  </section>
</main>
{{ end }}
