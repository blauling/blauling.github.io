{{ define "main" }}
<main class="container py-5">
  <section class="site-form-card site-form-page" aria-labelledby="requests-title">
    <h1 id="requests-title">{{ .Title }}</h1>
    <form data-supabase-form data-table="requests">
      <label for="request-message">What do you need?</label>
      <textarea id="request-message" name="message" required maxlength="5000" rows="6"></textarea>
      <button type="submit">Submit request</button>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
{{ end }}
